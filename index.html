<!DOCTYPE html>
<html>
<head>
    <title>Contract Intelligence</title>
    <style>
        :root {
            --color-bg: #f7f7f5;
            --color-card: #ffffff;
            --color-text: #1f2328;
            --color-muted: #6b7280;
            --color-border: #e5e7eb;
            --color-primary: #2563eb;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .subtitle { color: var(--color-muted); margin-bottom: 24px; font-size: 0.9rem; }

        .card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h3 { margin-top: 0; }

        button {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        input[type="file"] { margin-bottom: 12px; display: block; }

        #partySelection { display: none; }

        label { display: block; margin: 6px 0; font-size: 0.95rem; }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .meta-line {
            font-size: 0.85rem;
            color: var(--color-muted);
            margin-bottom: 10px;
        }

        .overall-risk {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--color-border);
        }

        .overall-risk-score {
            font-size: 1.3rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .overall-risk.risk-high { background: #fef2f2; border-color: #fecaca; }
        .overall-risk.risk-medium { background: #fffbeb; border-color: #fde68a; }
        .overall-risk.risk-low { background: #f0fdf4; border-color: #bbf7d0; }

        .overall-risk.risk-high .overall-risk-score { color: #dc2626; }
        .overall-risk.risk-medium .overall-risk-score { color: #d97706; }
        .overall-risk.risk-low .overall-risk-score { color: #16a34a; }

        .risk-card {
            border-left: 4px solid var(--color-border);
            padding: 8px 14px;
            margin-bottom: 10px;
            background: #fafafa;
            border-radius: 4px;
        }

        .risk-high { border-left-color: #dc2626; }
        .risk-medium { border-left-color: #d97706; }
        .risk-low { border-left-color: #16a34a; }

        .risk-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .risk-high .risk-label { color: #dc2626; }
        .risk-medium .risk-label { color: #d97706; }
        .risk-low .risk-label { color: #16a34a; }

        .section-tag {
            font-size: 0.8rem;
            color: var(--color-muted);
            font-weight: 400;
        }

        .risk-reasoning {
            margin: 4px 0 0;
            font-size: 0.9rem;
        }

        .clause-item {
            border-bottom: 1px solid var(--color-border);
            padding: 8px 0;
        }

        .clause-item:last-child { border-bottom: none; }

        .clause-item summary {
            cursor: pointer;
            font-size: 0.9rem;
        }

        .clause-excerpt summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--color-primary);
            margin-top: 6px;
        }

        .clause-text {
            background: #f3f4f6;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 6px;
            white-space: pre-wrap;
        }

        .missing-list {
            font-size: 0.9rem;
            padding-left: 20px;
        }

        .error-text {
            color: #dc2626;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>Contract Intelligence</h1>
    <div class="subtitle">Upload a contract, get clauses, risk flags, and a plain-English summary.</div>

    <div class="card">
        <input type="file" id="pdfInput" accept="application/pdf">
        <button id="extractBtn">Extract</button>
        <div id="output"></div>
    </div>

    <div id="clauseListCard" class="card" style="display:none;">
        <h3>Extracted Clauses</h3>
        <div id="clauseList"></div>
    </div>

    <div id="partySelection" class="card">
        <h3>Which party are you?</h3>
        <div id="partyOptions"></div>
        <button id="analyzeBtn">Analyze</button>
    </div>

    <div id="analysisOutput" class="card" style="display:none;"></div>

    <script>
        let contractText = null;
        let extractedResult = null;

        document.getElementById("extractBtn").addEventListener("click", async () => {
            const file = document.getElementById("pdfInput").files[0];
            const btn = document.getElementById("extractBtn");
            const output = document.getElementById("output");

            if (!file) {
                output.innerHTML = `<span class="error-text">Choose a PDF first.</span>`;
                return;
            }

            btn.disabled = true;
            btn.innerText = "Extracting...";
            document.getElementById("clauseListCard").style.display = "none";
            document.getElementById("partySelection").style.display = "none";
            document.getElementById("analysisOutput").style.display = "none";
            output.innerHTML = `<span class="spinner"></span> Reading your contract...`;

            try {
                const formData = new FormData();
                formData.append("file", file);

                const response = await fetch("http://localhost:8000/extract", {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Something went wrong reading this PDF.");
                }

                const data = await response.json();
                contractText = data.contract_text;
                extractedResult = data.extracted_result;

                if (!extractedResult.is_contract) {
                    output.innerHTML = `<span class="error-text">This doesn't look like a contract — try a different file.</span>`;
                    return;
                }

                output.innerText = `Found ${extractedResult.clauses.length} clauses across ${extractedResult.parties.length} parties.`;
                renderClauseList(extractedResult.clauses);
                renderPartyOptions(extractedResult.parties);

            } catch (err) {
                output.innerHTML = `<span class="error-text">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Extract";
            }
        });

        function renderClauseList(clauses) {
            let html = "";
            clauses.forEach((c) => {
                const sectionLabel = c.section_reference ? `Section ${c.section_reference}` : "No section number";
                html += `
                    <details class="clause-item">
                        <summary><strong>${sectionLabel}</strong> — ${c.clause_type.replaceAll("_", " ")}</summary>
                        <p class="clause-text">${c.clause_text}</p>
                    </details>
                `;
            });
            document.getElementById("clauseList").innerHTML = html;
            document.getElementById("clauseListCard").style.display = "block";
        }

        function renderPartyOptions(parties) {
            let html = `<label><input type="radio" name="party" value="" checked> Unspecified / neutral</label>`;
            parties.forEach((p) => {
                html += `<label><input type="radio" name="party" value="${p.role_label}"> ${p.role_label} (${p.name})</label>`;
            });
            document.getElementById("partyOptions").innerHTML = html;
            document.getElementById("partySelection").style.display = "block";
        }

        document.getElementById("analyzeBtn").addEventListener("click", async () => {
            const selected = document.querySelector('input[name="party"]:checked');
            const partyRole = selected.value || null;

            const btn = document.getElementById("analyzeBtn");
            const outputDiv = document.getElementById("analysisOutput");

            btn.disabled = true;
            btn.innerText = "Analyzing...";
            outputDiv.style.display = "block";
            outputDiv.innerHTML = `<span class="spinner"></span> Assessing risk and writing the summary...`;

            try {
                const requestBody = JSON.stringify({
                    contract_text: contractText,
                    extracted_result: extractedResult,
                    party_role: partyRole,
                });

                const response = await fetch("http://localhost:8000/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: requestBody,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Analysis failed.");
                }

                const result = await response.json();
                renderAnalysis(result);

            } catch (err) {
                outputDiv.innerHTML = `<span class="error-text">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze";
            }
        });

        function riskBucket(score) {
            if (score >= 7) return "high";
            if (score >= 4) return "medium";
            return "low";
        }

        function renderAnalysis(result) {
            const outputDiv = document.getElementById("analysisOutput");

            let html = `<div class="meta-line">${result.contract_type.replaceAll("_", " ")} · viewed as ${result.party_role}</div>`;

            const overallBucket = riskBucket(result.overall_risk_score);
            html += `
                <div class="overall-risk risk-${overallBucket}">
                    <span class="overall-risk-score">${result.overall_risk_score}/10</span>
                    <span>${result.overall_risk_explanation}</span>
                </div>
            `;

            html += `<h3>Summary</h3><p>${result.summary.replace(/\n/g, "<br>")}</p>`;

            html += `<h3>Risk Flags</h3>`;

            // clause_id is the reliable join key between risks and clauses — both echo
            // it back from the same extraction pass, so build a lookup by id rather
            // than trying to match on section_reference (can be empty or reused).
            const clausesById = {};
            result.clauses.forEach((c) => { clausesById[c.clause_id] = c; });

            const sortedRisks = [...result.risks].sort((a, b) => b.risk_score - a.risk_score);

            sortedRisks.forEach((risk) => {
                const clause = clausesById[risk.clause_id] || {};
                const typeLabel = (clause.clause_type || risk.clause_type).replaceAll("_", " ");
                const sectionLabel = risk.section_reference ? `Section ${risk.section_reference}` : "";
                const bucket = riskBucket(risk.risk_score);

                html += `
                    <div class="risk-card risk-${bucket}">
                        <span class="risk-label">${risk.risk_score}/10 · ${bucket}</span>
                        — <strong>${typeLabel}</strong> ${sectionLabel ? `<span class="section-tag">(${sectionLabel})</span>` : ""}
                        <p class="risk-reasoning">${risk.reasoning}</p>
                        ${clause.clause_text ? `
                            <details class="clause-excerpt">
                                <summary>Show clause text</summary>
                                <p class="clause-text">${clause.clause_text}</p>
                            </details>
                        ` : ""}
                    </div>
                `;
            });

            if (result.missing_clauses.length > 0) {
                html += `<h3>Missing Clauses</h3><ul class="missing-list">`;
                result.missing_clauses.forEach((type) => {
                    html += `<li>${type.replaceAll("_", " ")}</li>`;
                });
                html += `</ul>`;
            }

            outputDiv.innerHTML = html;
        }
    </script>
</body>
</html>
